kind: "AppHostingYaml"
schemaVersion: "v1"

# Firebase Console me set kiye secrets tabhi server (API routes) par milenge jab yahan RUNTIME declare hon.
environmentVariables:
  # Hosted web app under /app (pair with Hosting: website at `/`, rewrite `/app/**` here).
  # EXE/APK static builds never set this — they stay at `/`.
  - variable: WEB_APP_BASE_PATH
    value: "/app"
    availability: ["BUILD", "RUNTIME"]
  - variable: NEXT_PUBLIC_WEB_APP_BASE_PATH
    value: "/app"
    availability: ["BUILD", "RUNTIME"]
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    availability: ["BUILD", "RUNTIME"]
  - variable: STRIPE_SECRET_KEY
    availability: ["RUNTIME"]
  - variable: NEXT_PUBLIC_BASE_URL
    availability: ["BUILD", "RUNTIME"]
  - variable: NEXT_PUBLIC_APP_URL
    availability: ["BUILD", "RUNTIME"]
  - variable: NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID
    availability: ["BUILD", "RUNTIME"]
  - variable: GOOGLE_CLIENT_ID
    availability: ["RUNTIME"]
  - variable: GOOGLE_CLIENT_SECRET
    availability: ["RUNTIME"]
  - variable: FIREBASE_PROJECT_ID
    availability: ["RUNTIME"]
  - variable: FIREBASE_CLIENT_EMAIL
    availability: ["RUNTIME"]
  - variable: FIREBASE_PRIVATE_KEY
    availability: ["RUNTIME"]
  - variable: FIREBASE_STORAGE_BUCKET
    availability: ["RUNTIME"]