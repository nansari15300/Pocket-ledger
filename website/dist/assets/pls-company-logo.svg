<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" role="img" aria-labelledby="plsLogoTitle plsLogoDesc">
  <title id="plsLogoTitle">Pocket Ledger Solutions Pvt. Ltd.</title>
  <desc id="plsLogoDesc">Corporate logo — ledger mark with company wordmark</desc>
  <defs>
    <linearGradient id="plsMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071525"/>
      <stop offset="55%" stop-color="#0b1f3a"/>
      <stop offset="100%" stop-color="#2f80ed"/>
    </linearGradient>
    <linearGradient id="plsAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f80ed"/>
      <stop offset="100%" stop-color="#5cadff"/>
    </linearGradient>
    <filter id="plsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1f3a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Icon mark -->
  <g filter="url(#plsShadow)">
    <rect x="4" y="8" width="112" height="112" rx="26" fill="url(#plsMarkGrad)"/>
    <rect x="26" y="28" width="68" height="78" rx="8" fill="#ffffff" opacity="0.97"/>
    <rect x="26" y="28" width="68" height="18" rx="8" fill="url(#plsAccentGrad)"/>
    <rect x="26" y="38" width="68" height="8" fill="url(#plsAccentGrad)"/>
    <line x1="36" y1="56" x2="84" y2="56" stroke="#c5d8f2" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="36" y1="68" x2="78" y2="68" stroke="#c5d8f2" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="36" y1="80" x2="82" y2="80" stroke="#c5d8f2" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="36" y1="92" x2="70" y2="92" stroke="#c5d8f2" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="88" cy="36" r="10" fill="#1f9d6a"/>
    <path d="M84 36 L87 39 L93 33" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="136" y="52" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="800" fill="#0b1f3a" letter-spacing="-0.02em">
    Pocket Ledger Solutions
  </text>
  <text x="136" y="78" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#2f80ed" letter-spacing="0.12em">
    PVT. LTD.
  </text>
  <rect x="136" y="90" width="148" height="4" rx="2" fill="url(#plsAccentGrad)"/>
  <text x="136" y="114" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#5b6b7c">
    Business books software · Nepal
  </text>
</svg>
