<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Website Videos — Pocket Ledger</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="../../css/website-settings.css" />
  <style>
    .who { color: var(--muted); font-size: 0.9rem; }
    .row { margin: 0.85rem 0; }
    .row label { display: block; font-weight: 700; margin-bottom: 0.35rem; }
    .status { margin-top: 1rem; font-size: 0.95rem; }
    .status.ok { color: var(--ok); }
    .status.err { color: #b42318; }
    .video-admin-tools {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .video-admin-search input {
      width: min(28rem, 100%);
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      font: inherit;
    }
    .video-admin-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }
    .video-admin-tab {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.45rem 0.75rem;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }
    .video-admin-tab span { color: var(--muted); font-size: 0.78rem; }
    .video-admin-tab.is-active {
      border-color: var(--sky);
      background: var(--sky);
      color: #fff;
    }
    .video-admin-tab.is-active span { color: #fff; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .video-list { list-style: none; padding: 0; margin: 0.75rem 0 0; }
    .video-list li {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--line);
    }
    .video-admin-thumb {
      flex: 0 0 7.5rem;
      width: 7.5rem;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      background: #142033;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      display: grid;
      place-items: center;
    }
    .video-admin-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .video-admin-thumb-facebook { background: linear-gradient(135deg, #1877f2, #0b1f3a); }
    .video-admin-thumb-tiktok { background: linear-gradient(135deg, #25f4ee, #fe2c55, #142033); }
    .video-meta { min-width: 0; flex: 1; }
    .video-meta strong { display: block; }
    .video-meta span { color: var(--muted); font-size: 0.82rem; word-break: break-all; }
    .video-meta em {
      display: block;
      margin-top: 0.25rem;
      color: var(--muted);
      font-size: 0.8rem;
      font-style: normal;
    }
    .form-grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr;
    }
    @media (min-width: 720px) {
      .form-grid { grid-template-columns: 1fr 1fr; }
    }
    .check-row { display: flex; align-items: center; gap: 0.45rem; margin-top: 1.55rem; }
  </style>
</head>
<body class="website-settings-page" data-ws-active="videos">
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="../../">
        <span class="brand-mark" aria-hidden="true"></span>
        Pocket Ledger
      </a>
      <div class="nav-links">
        <span class="who" id="who"></span>
        <button type="button" class="btn btn-outline btn-sm" id="outBtn" hidden>Sign out</button>
      </div>
    </div>
  </header>

  <div class="ws-shell">
    <div id="websiteSettingsNav"></div>
    <main class="ws-main">
      <section class="page-hero">
        <div class="wrap">
          <h1>Website videos</h1>
          <p>Add YouTube, Facebook, or TikTok links for the marketing Videos section.</p>
        </div>
      </section>
      <section class="section">
        <div class="wrap ws-card">
          <div class="content-block" id="authBox">
            <p style="margin-top:0">Sign in with a Super Admin Google account.</p>
            <button type="button" class="btn btn-primary" id="googleBtn">Sign in with Google</button>
          </div>
          <div class="content-block" id="adminBox" hidden>
            <div class="form-grid">
              <div class="row" style="margin:0">
                <label for="videoTitle">Title</label>
                <input id="videoTitle" type="text" placeholder="How to create a company" />
              </div>
              <div class="row" style="margin:0">
                <label for="videoUrl">Video URL</label>
                <input id="videoUrl" type="url" placeholder="https://www.youtube.com/watch?v=..." />
              </div>
              <div class="row" style="margin:0">
                <label for="videoLabel">Label</label>
                <select id="videoLabel">
                  <option value="howto">How to use</option>
                  <option value="tutorial">Tutorial</option>
                  <option value="learning">Learning</option>
                  <option value="event">Event</option>
                  <option value="update">Update</option>
                </select>
              </div>
              <div class="row" style="margin:0">
                <label for="videoCategory">Category</label>
                <select id="videoCategory"></select>
              </div>
              <div class="check-row">
                <input id="videoPublished" type="checkbox" checked />
                <label for="videoPublished" style="margin:0;font-weight:600">Show on website</label>
                <button type="button" class="btn btn-primary btn-sm" id="addVideoBtn" style="margin-left:auto">Add video</button>
              </div>
            </div>
            <hr style="margin:1.5rem 0;border:0;border-top:1px solid var(--line)" />
            <div class="video-admin-tools">
              <label class="video-admin-search">
                <span class="sr-only">Search videos</span>
                <input id="videoSearch" type="search" placeholder="Search title, category, URL…" autocomplete="off" />
              </label>
              <div class="video-admin-tabs" id="videoPlatformTabs" role="tablist" aria-label="Video platform">
                <button type="button" class="video-admin-tab is-active" data-platform="all" aria-pressed="true">All <span id="tabCountAll">0</span></button>
                <button type="button" class="video-admin-tab" data-platform="youtube" aria-pressed="false">YouTube <span id="tabCountYoutube">0</span></button>
                <button type="button" class="video-admin-tab" data-platform="facebook" aria-pressed="false">Facebook <span id="tabCountFacebook">0</span></button>
                <button type="button" class="video-admin-tab" data-platform="tiktok" aria-pressed="false">TikTok <span id="tabCountTiktok">0</span></button>
              </div>
            </div>
            <div id="videoGroups"></div>
          </div>
          <p class="status" id="status"></p>
        </div>
      </section>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/website-settings-nav.js"></script>
  <script src="../../js/website-settings-auth.js"></script>
  <script src="../../js/website-videos-admin.js"></script>
</body>
</html>
