<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'" />
  <title>Tabs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* EXE tab strip: user — light pink “patti”; text/icons dark for contrast */
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: system-ui, "Segoe UI", sans-serif;
      font-size: 12px;
      background: #fdf2f8;
      color: #4c0519;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Ek row: ☰ + (tabs + +) grouped + draggable empty strip + gap + win buttons — duplicate static title strip me nahi */
    #bar {
      display: flex;
      align-items: center;
      height: 100%;
      min-height: 100%;
      padding: 0 0 0 4px;
      gap: 6px;
      border-bottom: 1px solid #fbcfe8;
      background: #fdf2f8;
    }
    #menuBtn {
      flex-shrink: 0;
      width: 36px;
      height: 30px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #831843;
      font-size: 16px;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    #menuBtn:hover { background: rgba(157, 23, 77, 0.12); }
    /* Tab strip left ↻ — reload active tab (Ctrl+R) */
    #syncBtn {
      flex-shrink: 0;
      width: 36px;
      height: 30px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #831843;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      -webkit-app-region: no-drag;
      font-family: system-ui, "Segoe UI", sans-serif;
    }
    #syncBtn:hover { background: rgba(157, 23, 77, 0.12); }
    /* Win/Linux merged: grouping + capped width taaki "+" tab ke baaju me rahe — mac framed: strip puri width tabs ke liye */
    #tabsChrome {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      min-width: 0;
      -webkit-app-region: no-drag;
    }
    body.merged-titlebar #tabsChrome {
      flex: 0 1 auto;
      max-width: min(920px, calc(100vw - 180px));
    }
    body:not(.merged-titlebar) #tabsChrome {
      flex: 1;
      max-width: none;
    }
    #dragFill {
      flex: 1;
      align-self: stretch;
      min-width: 48px;
      -webkit-app-region: drag;
      cursor: default;
    }
    #tabs {
      display: flex;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      align-items: flex-end;
      gap: 2px;
      padding: 4px 0 2px;
      scrollbar-width: thin;
      -webkit-app-region: no-drag;
    }
    body.merged-titlebar #tabs {
      flex: 0 1 auto;
    }
    body:not(.merged-titlebar) #tabs {
      flex: 1;
    }
    #tabs::-webkit-scrollbar { height: 4px; }
    #tabs::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 2px; }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 220px;
      min-width: 120px;
      height: 32px;
      padding: 0 10px 0 12px;
      background: #fce7f3;
      border: 1px solid #f9a8d4;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      flex-shrink: 0;
      color: #831843;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.65);
    }
    .tab:hover { background: #fbcfe8; color: #4c0519; }
    .tab.active {
      background: #ffffff;
      color: #4c0519;
      padding-bottom: 1px;
      margin-bottom: -1px;
      z-index: 1;
      box-shadow: 0 0 0 1px #f9a8d4;
    }
    .tab.active .title { font-weight: 600; }
    .tab .title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      line-height: 1.2;
    }
    .tab .close {
      opacity: 0.7;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 15px;
      line-height: 1;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .tab .close:hover { opacity: 1; background: rgba(157, 23, 77, 0.12); }
    #newBtn {
      flex-shrink: 0;
      width: 32px;
      height: 28px;
      margin-bottom: 2px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #9d174d;
      font-size: 20px;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    #newBtn:hover { background: rgba(157, 23, 77, 0.12); color: #4c0519; }
    /* Minimize ke pehle exactly 10px — user request */
    #chromeGap {
      flex-shrink: 0;
      width: 10px;
      height: 1px;
      -webkit-app-region: no-drag;
    }
    #winControls {
      display: none;
      flex-shrink: 0;
      align-items: center;
      height: 100%;
      padding-right: 4px;
      gap: 0;
      -webkit-app-region: no-drag;
    }
    body.merged-titlebar #winControls { display: flex; }
    body.merged-titlebar #chromeGap { display: block; }
    body:not(.merged-titlebar) #chromeGap,
    body:not(.merged-titlebar) #menuBtn,
    body:not(.merged-titlebar) #dragFill {
      display: none !important;
    }
    #winControls button {
      width: 46px;
      height: 100%;
      min-height: 36px;
      border: none;
      background: transparent;
      color: #831843;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #winControls button:hover { background: rgba(157, 23, 77, 0.14); }
    #closeBtn:hover { background: #e81123; color: #fff; }
  </style>
</head>
<body>
  <div id="bar">
    <button type="button" id="menuBtn" title="Menu (Alt)">&#9776;</button>
    <button type="button" id="syncBtn" title="Reload (Ctrl+R)">&#x21bb;</button>
    <div id="tabsChrome">
      <div id="tabs"></div>
      <button type="button" id="newBtn" title="New tab (Ctrl+T)">+</button>
    </div>
    <div id="dragFill" title="" aria-hidden="true"></div>
    <div id="chromeGap" aria-hidden="true"></div>
    <div id="winControls">
      <button type="button" id="minBtn" title="Minimize">&#x2013;</button>
      <button type="button" id="maxBtn" title="Maximize">&#x25A1;</button>
      <button type="button" id="closeBtn" title="Close">&#x2715;</button>
    </div>
  </div>
  <script src="./tab-strip.js"></script>
</body>
</html>
